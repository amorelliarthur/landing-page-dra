<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF9F6">
<title>Cirurgiã-dentista | Ortodontia e Harmonização Orofacial</title>
<meta name="description" content="Ortodontia e Harmonização Orofacial planejadas juntas, com avaliação cuidadosa e foco em naturalidade.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (paleta extraída da foto) ===== */
:root{
  --papel:#FBF9F6;        /* branco quente */
  --champagne:#F2EADF;    /* blazer sob luz */
  --bege:#D9CBB8;
  --ouro:#B8965A;         /* decorativo: linhas e detalhes */
  --ouro-texto:#7A5C2E;   /* dourado com contraste AA para texto */
  --ciano:#1D6B76;        /* detalhe azul-ciano (AA sobre claro) */
  --ciano-claro:#8FCBD3;  /* ciano sobre fundo escuro */
  --tinta:#2E231D;        /* espresso, do tom do cabelo */
  --tinta-suave:#6A5A4E;
  --serif:"Cormorant Garamond","Garamond","Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --medida:68ch;
  --margem:clamp(1.25rem,5vw,4.5rem);
  --secao:clamp(5rem,12vw,9.5rem);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(4.5rem + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-weight:400;font-size:clamp(1rem,.95rem + .25vw,1.125rem);line-height:1.6;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--ciano);outline-offset:3px;border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:absolute;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:#fff;padding:.6rem 1rem;text-decoration:none}
.pular:focus{top:calc(1rem + env(safe-area-inset-top,0px))}

/* ===== Tipografia ===== */
h1,h2,h3,blockquote{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em,h3 em,blockquote em{font-style:italic;color:var(--ouro-texto)}
.t-xl{font-size:clamp(2.75rem,6vw,4.5rem);line-height:1.05}      /* H1: 72px */
.t-l{font-size:clamp(2.25rem,4.6vw,3.75rem);line-height:1.05}     /* H2: 60px */
.t-l.maior{font-size:clamp(2.6rem,6vw,4.5rem)}                   /* H2: 72px */
.t-l.menor{font-size:clamp(2rem,3.8vw,3rem)}                      /* H2: 48px */
h3{font-size:clamp(1.5rem,2vw,1.875rem);line-height:1.2;font-weight:500} /* H3: 24–30px */
.eyebrow{display:block;font:500 .6875rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ciano);margin-bottom:1rem} /* 11px */
p{margin:0 0 1.1em;max-width:var(--medida)}
.lead{font:italic 400 clamp(1.25rem,1.8vw,1.5rem)/1.4 var(--serif);color:var(--tinta-suave)}
.nota{font-size:.875rem;color:var(--tinta-suave)}

/* ===== Layout ===== */
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--margem)}
section{padding:var(--secao) 0}
.grade{display:grid;gap:2.5rem}
@media (min-width:900px){
  .grade{grid-template-columns:repeat(12,1fr);gap:2rem 2.5rem}
  .c-titulo{grid-column:1/6}
  .c-corpo{grid-column:7/13}
  .ortodontia .c-titulo,.harmo .c-titulo,.faq .c-titulo{position:sticky;top:calc(7rem + env(safe-area-inset-top,0px));align-self:start}
}

/* ===== Botões ===== */
.btn{display:inline-flex;align-items:center;gap:.6rem;min-height:3.25rem;padding:.85rem 1.6rem;font:500 .75rem/1 var(--sans);letter-spacing:.06em;text-decoration:none;border:1px solid var(--tinta);border-radius:999px;transition:transform .25s ease,opacity .25s ease;cursor:pointer}
.btn-cheio{background:var(--tinta);color:#fff}
.btn-cheio:hover{transform:translateY(-2px)}
.btn-linha{background:transparent;color:var(--tinta)}
.btn-linha:hover{transform:translateY(-2px)}
.btn svg{width:1.1rem;height:1.1rem;flex:none}
.acoes{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.2rem}

/* ===== Topo ===== */
.topo{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:transform .35s ease}
.topo::before{content:"";position:absolute;inset:0;background:var(--papel);opacity:0;transition:opacity .35s ease;border-bottom:1px solid var(--bege)}
.topo.solido::before{opacity:.97}
.topo .wrap{position:relative;display:flex;align-items:center;justify-content:space-between;height:4.5rem}
.marca{font:500 1.35rem/1.1 var(--serif);text-decoration:none}
.marca small{display:block;font:500 .625rem/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave)}
.nav{display:none;gap:2rem;list-style:none;margin:0;padding:0;font-size:.75rem;font-weight:500;letter-spacing:.06em}
.nav a{text-decoration:none;padding:.4rem 0;background:linear-gradient(var(--ouro),var(--ouro)) 0 100%/0 1px no-repeat;transition:background-size .3s}
.nav a:hover{background-size:100% 1px}
.topo .btn{display:none;min-height:2.6rem;padding:.6rem 1.15rem}
@media (min-width:900px){.topo .btn{display:inline-flex}}
@media (min-width:1000px){.nav{display:flex}}

/* ===== 1. Hero ===== */
.hero{position:relative;padding:0;overflow:hidden;background:var(--papel)}

.hero-foto{position:relative;height:64svh;min-height:420px;background:#BDB7B7}
.hero-foto img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hero-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--papel) 0%,rgba(251,249,246,.6) 18%,rgba(251,249,246,0) 42%)}
.hero-conteudo{position:relative;margin-top:-3rem;padding-bottom:calc(3.5rem + env(safe-area-inset-bottom,0px))}
.hero h1 span{display:block}
.hero-sub{margin-top:1.4rem;color:var(--tinta-suave)}
@media (min-width:900px){
  .hero{display:flex;align-items:center;min-height:100svh}
  .hero-foto{position:absolute;inset:0 0 0 40%;height:auto;min-height:0}
  .hero-foto img{object-position:50% 22%}
  .hero-foto::after{background:linear-gradient(to right,var(--papel) 0%,rgba(251,249,246,.75) 22%,rgba(251,249,246,0) 48%)}
  .hero-conteudo{margin-top:0;padding-top:6rem;padding-bottom:4rem}
  .hero-texto{max-width:34rem}
}
/* único momento orquestrado: entrada da headline */
.hero h1 span,.hero-sub,.hero .acoes{opacity:0;transform:translateY(18px);animation:sobe .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero h1 span:nth-child(2){animation-delay:.15s}
.hero h1 span:nth-child(3){animation-delay:.3s}
.hero-sub{animation-delay:.5s}
.hero .acoes{animation-delay:.62s}
@keyframes sobe{to{opacity:1;transform:none}}

/* ===== 2. Propósito ===== */
.proposito blockquote{font-style:italic;font-size:clamp(1.25rem,1.8vw,1.5rem);line-height:1.4;max-width:28ch}
.proposito blockquote::before{content:"“";display:block;font-size:4.5rem;line-height:.6;color:var(--ouro);margin-bottom:.8rem;font-style:normal}
.proposito .c-corpo{align-self:end}

/* ===== 3. Sobre ===== */
.sobre{background:var(--champagne)}
.tags{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.8rem 0 1.2rem;padding:0;list-style:none}
.tags li{border:1px solid var(--ouro);border-radius:999px;padding:.35rem 1rem;font-size:.9rem}
.formacao{list-style:none;padding:0;margin:1.5rem 0;border-top:1px solid var(--bege)}
.formacao li{padding:.85rem 0;border-bottom:1px solid var(--bege)}
.cro{font-weight:500;color:var(--ciano);letter-spacing:.02em}

/* ===== 4/5. Listas numeradas ===== */
.lista-num{list-style:none;padding:0;margin:2.2rem 0 0;counter-reset:n}
.lista-num li{counter-increment:n;display:grid;grid-template-columns:2.2rem 1fr;gap:0 1rem;padding:1.4rem 0;border-top:1px solid var(--bege)}
.lista-num li:last-child{border-bottom:1px solid var(--bege)}
.lista-num li::before{content:counter(n,decimal-leading-zero);font:600 .75rem/2.6 var(--serif);letter-spacing:.08em;font-variant-numeric:lining-nums;color:var(--ouro-texto)}

.lista-num p{margin:.35rem 0 0;color:var(--tinta-suave);font-size:1rem}
.harmo{border-top:1px solid var(--bege)}

/* ===== 6. Manifesto ===== */
.manifesto{background:var(--tinta);color:var(--champagne);text-align:left}
.manifesto h2{font-size:clamp(2.6rem,6vw,4.5rem);line-height:1.05;max-width:16ch;color:#fff}
.manifesto h2 em{color:var(--ciano-claro)}
.manifesto p{color:var(--champagne);font:italic 400 clamp(1.25rem,1.8vw,1.5rem)/1.4 var(--serif);margin-top:2.5rem;max-width:40ch}
.manifesto .fio{width:4rem;height:1px;background:var(--ouro);margin:3rem 0 0}

/* ===== 7. Planejamento facial ===== */
.plan-grade{display:grid;gap:3rem}
.rosto{position:relative;background:#BDB7B7;aspect-ratio:46/56;max-width:520px;width:100%;overflow:hidden}
.rosto svg{width:100%;height:100%;display:block}
.analise line,.analise path{stroke:#fff;stroke-width:1.6;fill:none;vector-effect:non-scaling-stroke}
.analise .dourado{stroke:#D9B977;stroke-width:2.4}
.analise .ciano{stroke:#7FD3DE;stroke-width:1.8}
.analise .tracejado{stroke-dasharray:5 6}
.analise g{opacity:0;transition:opacity .6s ease}
.analise g>*{transform-box:fill-box;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.analise .h{transform:scaleX(0);transform-origin:center}
.analise .v{transform:scaleY(0);transform-origin:top}
.analise .d{transform:scaleX(0);transform-origin:left}
.analise g.on{opacity:1}
.analise g.on>*{transform:none}
.analise text{font:500 13px var(--sans);fill:#fff;letter-spacing:.03em}
.passos{list-style:none;margin:0;padding:0;counter-reset:p}
.passo{counter-increment:p;padding:1.6rem 0;border-top:1px solid var(--bege)}
.passo::before{content:counter(p,decimal-leading-zero);display:block;font:600 .75rem/1 var(--serif);letter-spacing:.08em;font-variant-numeric:lining-nums;color:var(--ouro-texto);margin-bottom:.9rem}

.passo p{margin:.5rem 0 0;color:var(--tinta-suave)}
.passo .chave{display:inline-block;width:1.6rem;height:2px;vertical-align:middle;margin-right:.6rem;transform:scaleX(.35);transform-origin:left;transition:transform .6s ease}
.passo.ativo .chave{transform:none}
@media (min-width:900px){
  .plan-grade{grid-template-columns:5fr 6fr;gap:5rem;align-items:start}
  .rosto-fixo{position:sticky;top:calc(6rem + env(safe-area-inset-top,0px))}
  .passo{padding:3rem 0 6rem}
}

/* ===== 8. Antes e depois ===== */
.comparar{position:relative;max-width:760px;aspect-ratio:4/3;overflow:hidden;background:var(--bege);--pos:50%}
.comparar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.comparar .antes{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.comparar .divisor{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:#fff;pointer-events:none}
.comparar input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.comparar .rot{position:absolute;bottom:.8rem;background:rgba(46,35,29,.78);color:#fff;font-size:.8rem;padding:.25rem .7rem;border-radius:999px}
.ad-nav{display:flex;align-items:center;gap:1rem;margin-top:1.2rem}

/* ===== 9. Conteúdos ===== */
.filtros{display:flex;flex-wrap:wrap;gap:.5rem;margin:2rem 0 2.5rem}
.filtros button{font:500 .75rem var(--sans);letter-spacing:.06em;color:var(--tinta);background:transparent;border:1px solid var(--bege);border-radius:999px;padding:.55rem 1.1rem;min-height:2.75rem;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.temas{display:grid;gap:0 2.5rem;list-style:none;margin:0;padding:0}
@media (min-width:700px){.temas{grid-template-columns:1fr 1fr}}
@media (min-width:1050px){.temas{grid-template-columns:1fr 1fr 1fr}}
.temas li{border-top:1px solid var(--bege)}
.temas a{display:block;padding:1.4rem 0 1.6rem;text-decoration:none}

.temas h3{font-size:1.5rem;line-height:1.25;margin-top:.1rem;transition:transform .3s ease}
.temas a:hover h3{transform:translateX(4px)}
.temas [hidden]{display:none}

/* ===== 10. FAQ ===== */
.faq{background:var(--champagne)}
.faq details{border-top:1px solid var(--bege)}
.faq details:last-child{border-bottom:1px solid var(--bege)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:1.5rem;padding:1.4rem 0;font:500 1.5rem/1.3 var(--serif)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:300 1.6rem/1 var(--sans);color:var(--ouro-texto);transition:transform .3s ease;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .resp{padding:0 0 1.5rem;color:var(--tinta-suave)}
.faq details[open] .resp{animation:aparece .45s ease}
@keyframes aparece{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ===== 11. Localização ===== */
.locais{display:grid;gap:1.5rem;margin-top:3rem}
@media (min-width:760px){.locais{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
.local{border:1px solid var(--bege);padding:2rem;background:#fff}

.local h3{margin:0 0 .8rem}
.local address{font-style:normal;color:var(--tinta-suave);margin-bottom:1.4rem}
.local a{font-weight:500;text-underline-offset:4px;text-decoration-color:var(--ouro)}

/* ===== 12. CTA final ===== */
.final{text-align:center;border-top:1px solid var(--bege)}
.final h2{max-width:18ch;margin:0 auto}
.final p{margin:1.5rem auto 0}
.final .acoes{justify-content:center}

/* ===== 13. Rodapé ===== */
.rodape{background:var(--tinta);color:var(--champagne);padding:4rem 0 calc(6rem + env(safe-area-inset-bottom,0px));font-size:.95rem}
.rodape .nome{font:500 1.875rem var(--serif);color:#fff}
.rodape a{color:var(--champagne);text-underline-offset:4px}
.rodape .cols{display:grid;gap:2rem;margin-top:2rem}
@media (min-width:800px){.rodape .cols{grid-template-columns:repeat(3,1fr)}.rodape{padding-bottom:4rem}}
.rodape .aviso{margin-top:3rem;padding-top:1.5rem;border-top:1px solid rgba(232,217,194,.25);color:#CDBFAE;font-size:.85rem;max-width:none}

/* ===== WhatsApp flutuante (mobile) ===== */
.flutuante{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:60;display:inline-flex;align-items:center;gap:.5rem;background:var(--ciano);color:#fff;text-decoration:none;border-radius:999px;padding:.85rem 1.2rem;font:500 .75rem var(--sans);letter-spacing:.06em;box-shadow:0 8px 24px rgba(46,35,29,.22);transition:transform .35s ease,opacity .35s ease}
.flutuante svg{width:1.2rem;height:1.2rem}
.flutuante.oculto{opacity:0;transform:translateY(140%);pointer-events:none}
@media (min-width:900px){.flutuante{display:none}}

/* ===== Entradas no scroll (discretas) ===== */
.js [data-revela]{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.js [data-revela].visivel{opacity:1;transform:none}

/* ===== Movimento reduzido ===== */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero h1 span,.hero-sub,.hero .acoes,.js [data-revela]{opacity:1;transform:none}
  .analise g{opacity:1}.analise g>*{transform:none}.passo .chave{transform:none}
}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="topo" id="topo">
  <div class="wrap">
    <a class="marca" href="#inicio" id="marca"></a>
    <nav aria-label="Seções"><ul class="nav">
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#ortodontia">Ortodontia</a></li>
      <li><a href="#harmonizacao">Harmonização</a></li>
      <li><a href="#perguntas">Dúvidas</a></li>
      <li><a href="#onde">Onde atendo</a></li>
    </ul></nav>
    <a class="btn btn-cheio" data-wa href="#">Agendar avaliação</a>
  </div>
</header>

<main id="conteudo">
  <section class="hero" id="inicio" aria-labelledby="hero-titulo"></section>
  <section class="proposito" id="proposito"></section>
  <section class="sobre" id="sobre"></section>
  <section class="ortodontia" id="ortodontia"></section>
  <section class="harmo" id="harmonizacao"></section>
  <section class="manifesto" id="naturalidade"></section>
  <section class="planejamento" id="planejamento"></section>
  <section class="antes-depois" id="antes-depois" hidden></section>
  <section class="conteudos" id="conteudos"></section>
  <section class="faq" id="perguntas"></section>
  <section class="onde" id="onde"></section>
  <section class="final" id="agendar"></section>
</main>

<footer class="rodape" id="rodape"></footer>
<a class="flutuante" id="flutuante" data-wa href="#"></a>

<script>
/* =========================================================
   CONFIG — todos os dados da cliente ficam aqui.
   Itens entre [COLCHETES] ainda precisam ser confirmados.
   Use *asteriscos* para colocar palavras em itálico.
   ========================================================= */
const CONFIG = {
  nome: "[NOME]",                       // ex.: "Mariana Alves"
  tratamento: "Dra.",
  profissao: "Cirurgiã-dentista",
  especialidades: ["Ortodontia", "Harmonização Orofacial"],
  cro: { uf: "[UF]", numero: "[NÚMERO]" },
  // Só chame de "especialista" se houver registro de especialidade (RQE) no CFO.
  rqe: [],                              // ex.: ["RQE Ortodontia 1234", "RQE HOF 5678"]
  whatsapp: "[55DDDNUMERO]",            // só números, com 55 + DDD. ex.: "5535999999999"
  instagram: "[PERFIL]",                // sem @
  cidades: ["[CIDADE 1]", "[CIDADE 2]"],
  fotoHero: "",                         // vazio = usa a foto embutida no fim do arquivo
  fotoAlt: "Retrato da dentista, de blazer branco, em fundo cinza claro",

  hero: {
    escolhida: 0,                       // troque para 1 ou 2 para testar as outras opções
    opcoes: [
      ["Seu sorriso conta uma história.", "Seu rosto conta outra.", "*Eu cuido para que sejam uma só.*"],
      ["Cada sorriso é único.", "Cada rosto também.", "*Meu trabalho é preservar você.*"],
      ["Alinhar o sorriso.", "Equilibrar o rosto.", "*Sem deixar de ser quem você é.*"]
    ]
  },

  proposito: {
    frase: "[PEDIR À CLIENTE: frase que a representa]",
    // RASCUNHO — validar com a cliente
    texto: "Escolhi trabalhar com sorriso e rosto porque é ali que a gente se reconhece no espelho. Gosto de entender o que incomoda cada pessoa antes de pensar em qualquer tratamento. Meu objetivo é que você saia de cada consulta entendendo o que está sendo feito, e por quê."
  },

  sobre: {
    formacao: [                         // NÃO inventar: preencher com a formação real
      "[FORMAÇÃO 1 — curso, instituição]",
      "[FORMAÇÃO 2 — curso, instituição]"
    ],
    // RASCUNHO — validar com a cliente
    texto: [
      "Sou cirurgiã-dentista e trabalho com Ortodontia e Harmonização Orofacial. Na prática, isso significa que olho para o sorriso e para o rosto ao mesmo tempo: a posição dos dentes influencia os lábios, o perfil e a expressão.",
      "Por isso, planejo os dois juntos. Começo sempre com uma avaliação sem pressa, explico o que vejo e o que é possível, e só então conversamos sobre o caminho. Você participa de cada decisão."
    ]
  },

  ortodontia: {
    escolhido: 0,
    titulos: [
      "Alinhar é cuidar da *função*. A beleza vem junto.",
      "Antes do sorriso bonito, *o sorriso que funciona*.",
      "Dentes no lugar certo. *Rosto em equilíbrio*."
    ],
    texto: "Ortodontia vai além da estética. Dentes bem posicionados ajudam na mastigação, na fala e na saúde da gengiva. Indico o tipo de aparelho depois de avaliar o seu caso e a sua rotina.",
    // EXEMPLOS — substituir pela lista real de tratamentos da cliente
    tratamentos: [
      { nome: "Aparelho fixo", desc: "Indicado para muitos tipos de correção, com acompanhamento periódico." },
      { nome: "Alinhadores transparentes", desc: "Placas removíveis e discretas, quando o caso permite." },
      { nome: "Ortodontia para crianças", desc: "Acompanhar o crescimento para orientar o desenvolvimento dos dentes e arcadas." },
      { nome: "Contenção e acompanhamento", desc: "A fase que ajuda a manter o resultado depois do aparelho." }
    ]
  },

function injetarSchema() {

/* ================= Comportamentos ================= */
function comportamentos() {
  // Topo ganha fundo depois do hero
  const topo = $("#topo");
  const aoRolar = () => topo.classList.toggle("solido", scrollY > 40);
  addEventListener("scroll", aoRolar, { passive: true }); aoRolar();

  const io = (cb, opts) => new IntersectionObserver(es => es.forEach(cb), opts);

  // Entradas discretas
  if (!reduzMovimento) {
    const obs = io(e => { if (e.isIntersecting) { e.target.classList.add("visivel"); obs.unobserve(e.target); } }, { rootMargin: "0px 0px -10% 0px" });
    document.querySelectorAll("[data-revela]").forEach(el => obs.observe(el));
  }

  // Linhas de análise: cada passo revela suas linhas (e mantém as anteriores)
  const grupos = document.querySelectorAll("[data-linha]");
  const passos = document.querySelectorAll("[data-passo]");
  const ativar = n => {
    grupos.forEach(g => g.classList.toggle("on", Number(g.dataset.linha) <= n));
    passos.forEach(p => p.classList.toggle("ativo", Number(p.dataset.passo) <= n));
  };
  if (reduzMovimento) ativar(passos.length - 1);
  else {
    let agendado = false;
    const calc = () => {
      agendado = false;
      let n = -1;
      passos.forEach((p, i) => { if (p.getBoundingClientRect().top < innerHeight * 0.6) n = i; });
      ativar(n);
    };
    addEventListener("scroll", () => { if (!agendado) { agendado = true; requestAnimationFrame(calc); } }, { passive: true });
    calc();
  }

  // Botão flutuante some quando o CTA final está na tela
  const flut = $("#flutuante");
  const visiveis = new Set();
  const obsF = io(e => { e.isIntersecting ? visiveis.add(e.target) : visiveis.delete(e.target); flut.classList.toggle("oculto", visiveis.size > 0); });
  obsF.observe($("#inicio .acoes")); obsF.observe($("#agendar"));

  // Aviso no console sobre campos pendentes
  const pendentes = JSON.stringify(CONFIG).match(/\[[^\[\]"]*[A-ZÁÉÍÓÚÇ]{2,}[^\[\]"]*\]/g);
  if (pendentes) console.warn("Campos pendentes no CONFIG:", [...new Set(pendentes)]);
